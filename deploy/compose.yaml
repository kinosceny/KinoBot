volumes:
  mongodb_data:

services:
  bot:
    container_name: bot
    build:
      context: ..
      dockerfile: deploy/app/Dockerfile
    volumes:
      - "../bot:/app/bot"
    env_file:
      - .env
    restart: always
    networks:
      - internal

  database:
    container_name: postgres
    image: postgres:14.17-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      - internal

networks:
  internal:
    driver: bridge