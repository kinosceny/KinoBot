version: "3.9"

services:
  bot:
    container_name: bot
    build:
      context: ..
      dockerfile: deploy/app/Dockerfile
    volumes:
      - "../bot:/app/bot"
      - "/var/www/admin/data/www/tglibs.top/files:/app/bot/files"
    env_file:
      - .env
    restart: always
    networks:
      - internal

  database:
    container_name: postgres
    image: postgres:14.17-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

volumes:
  postgres_data:
    driver: local

networks:
  internal:
    driver: bridge