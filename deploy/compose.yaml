version: "3.9"

services:
  bot:
    container_name: bot
    build:
      context: ..
      dockerfile: deploy/app/Dockerfile
    volumes:
      - "../bot:/app/bot"
      - "/var/www/admin/data/www/tglibs.top/files:/app/bot/files"
    env_file:
      - .env
    depends_on:
      - telegram-bot-api
    restart: always
    networks:
      - internal

  database:
    container_name: postgres
    image: postgres:14.17-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
  
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ""
      TELEGRAM_API_HASH: ""
      TELEGRAM_LOCAL: "true"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"
    networks:
      - internal

volumes:
  postgres_data:
    driver: local
  telegram-bot-api-data:

networks:
  internal:
    driver: bridge